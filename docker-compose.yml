services:
  shelfhelp:
    image: ghcr.io/nathanapples/shelfhelp:latest
    container_name: shelfhelp
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # - LOG_RECOVERY_LINK=true   # lets "Can't sign in?" put a one-time admin link in the container log
    volumes:
      - ./config:/config
    ports:
      - 5075:5075
    restart: unless-stopped
